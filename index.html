<style>
:root { --bg: #f6f4fa; --surface: #fff; --ink: #2b2a33; --muted: #66637a; --line: #e4e0ee; --accent: #2f7a5f; --fill: #c8ebdd; --fill-ink: #1e4d3c; --lav: #e9e2f8; --alert: #b83d33; --alert-fill: #ffdcd7; --butter: #fff3c4; --butter-ink: #6f5300; --miso: #9a4e2a; --miso-bg: #ffe4d6; --sky: #d6eaff; --sky-ink: #1d5a92; --r: 22px; --r-md: 14px; --shadow: 0 6px 18px rgba(98, 84, 150, .16); }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.day { display: grid; gap: 6px; }

.qf .qu { width: 3.6em; flex: none; }

.qf.nog .qsub { display: none; }
.list li.qrow { flex-wrap: wrap; }
.list li.qrow .nm { flex-basis: 100%; }
.list .qf.q { width: 100%; }
.red { color: var(--alert); font-weight: 700; }
.lackrow { background: var(--alert-fill); border-radius: 8px; padding: 6px 8px; }
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; }
.sheet[hidden] { display: none; }
html.sheetOpen, html.sheetOpen body { overflow: hidden; }
.sheet-bg { position: absolute; inset: 0; background: rgba(30, 25, 45, .35); }
.sheet-body { position: relative; background: var(--bg); border-radius: 20px 20px 0 0; max-height: 90%; overflow: auto; overscroll-behavior: contain; padding: 16px 14px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
.busy { position: fixed; inset: 0; z-index: 40; background: rgba(20, 18, 28, .82); color: #fff; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 20px; }
.busy[hidden] { display: none; }
.spin { width: 46px; height: 46px; border-radius: 999px; border: 5px solid #3a3644; border-top-color: #cfc9dd; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.slotgrid { display: grid; gap: 4px; }

// --- 栄養: 1人分の合計（外食予定は標準的な1食分） ---
function dayNut(d, plans) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  const seen = new Set();
  (plans || S.plans).filter(p => p.date === d && !isSik(p)).forEach(p => { const k = p.meal + "|" + p.title; if (seen.has(k)) return; seen.add(k);
    const n = isOut(p) ? OUT_EST[p.meal] : recipeOf(p.recipeId); if (!n) return;
    ["kcal", "p", "f", "c"].forEach(k => { t[k] += +n[k] || 0; });
  });
  return t;
}
// 1人だけで食べる食事（設定「食べる人」: {"日付|食事": 食べる人の番号}）。もう1人は外食として数える
const soloMap = () => { try { return JSON.parse(SET("食べる人") || "{}") || {}; } catch (e) { return {}; } };
const soloOf = (d, m) => +soloMap()[d + "|" + m] || 0;
const soloPeople = so => so ? Math.round(sh(so) * 10) / 10 : 2;   // 1人だけの食事の人数（その人の盛り分けの比。例 🧑🏻1.1人分）
const soloTag = (d, m) => { const so = soloOf(d, m); return so ? `${SET("人" + so)}だけ` : ""; };

function nutP(d, i, plans) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 }, seen = new Set(), outM = new Set();
  (plans || S.plans).filter(p => p.date === d && !isSik(p)).forEach(p => {
    const so = soloOf(d, p.meal);
    if (so && so !== i) { if (outM.has(p.meal)) return; outM.add(p.meal); ["kcal", "p", "f", "c"].forEach(k => { t[k] += OUT_EST[p.meal][k] || 0; }); return; }
    const key = p.meal + "|" + p.title; if (seen.has(key)) return; seen.add(key);
    const n = isOut(p) ? OUT_EST[p.meal] : recipeOf(p.recipeId); if (!n) return;
    ["kcal", "p", "f", "c"].forEach(k => { t[k] += (+n[k] || 0) * sh(i); });
  });
  dailyItems().forEach(it => { if ((!it.who || it.who === i) && dailyOn(d, it, plans)) ["kcal", "p", "f", "c"].forEach(k => { t[k] += +it[k] || 0; }); });
  return t;
}
// 2人の盛り分け: 料理は2人の目標カロリーの比で分けて食べる。sh(i) は「平均的な1人分」に対する、その人の量の倍率
const sh = i => { const a = target(1).kcal, b = target(2).kcal; return a > 0 && b > 0 ? 2 * target(i).kcal / (a + b) : 1; };
const shPct = i => Math.round(sh(i) * 50);

  const L = { kcal: "カロリー", p: "P たんぱく質", f: "F 脂質", c: "C 炭水化物" }, U = { kcal: "kcal", p: "g", f: "g", c: "g" };

  const ups = []; S.stock.forEach(x => { const v = vegOf(x.name); if (!v || v.u !== "個" || /^(あり|わずか)$/.test(x.qty) || !/(株|節|玉|丁|房)/.test(x.qty)) return; const n = vegN(x.name, x.qty, v); if (n == null) return; const q = vegFmt(n, v); if (q && q !== x.qty) ups.push({ ...x, qty: q }); });

// 単位の設定: 野菜の単位と分母（1/4・1/8 など）を決める。「グラムなどで数える」で分数をやめる
// 単位は g・ml・個・本・袋・切れ だけ。g・ml は分数にしない（レシピに書いた量のまま数える）。個・袋は「分けかた」で数える
const VEG_UNITS = ["g", "ml", "個", "本", "袋", "切れ"], GM = u => u === "g" || u === "ml";
// その食材の今の設定（g・ml の物も含む）: {u, d, pack}
function unitOf(name) {
  const v = vegOf(name); if (v) return v;
  const m = vegMap(), b = vegBase(name), hit = m[name] || m[normName(name)] || (b && m[b.name]);
  return { u: hit && hit.off && GM(hit.u) ? hit.u : "g", d: 1, pack: hit && hit.off ? +hit.pack || 0 : 0 };
}
// 1週間の量（この倍数で使う・買う）: {u, n}
const packOf = name => { const v = unitOf(name); return v.pack > 0 ? { u: v.u, n: v.pack } : null; };

  return `<div class="grid2 vset"><label>単位<select class="vsU">${VEG_UNITS.map(u => `<option ${v.u === u ? "selected" : ""}>${u}</option>`).join("")}</select></label><label>分けかた（個・袋のとき）<select class="vsD">${[[1, "分けない"], [2, "1/2ずつ"], [4, "1/4ずつ"], [8, "1/8ずつ"]].map(([d, l]) => `<option value="${d}" ${v.d === d ? "selected" : ""}>${l}</option>`).join("")}</select></label></div><label>1週間で使い切りたい量（使うならこの量の倍数で。例: 1 → 1缶・2缶…で、1/2缶にはしない。空なら決まりなし）<input class="vsP" value="${v.pack ? fracText(v.pack) : ""}" placeholder="なし" autocomplete="off"></label>`;
}
const unitSetVal = el => { const u = el.querySelector(".vsU").value, p = el.querySelector(".vsP"), pack = p ? numOf(p.value.normalize("NFKC")) || 0 : 0; return GM(u) ? { off: true, u, pack } : { u, d: +el.querySelector(".vsD").value, pack }; };

// 作る日変更（今週）: 今の状態（レシピ・作り置き・外食・なし）を出し、変えて「変更する」で組み直す
function openRebuild(ws) {
  const stOf = x => { const ps = S.plans.filter(p => p.date === x.d && p.meal === x.m && p.status !== "作った"); if (!ps.length) return "skip"; if (ps.some(isOut)) return "out"; if (ps.every(isLo)) return "lo"; return "new"; };
  S.slotSel = { ws, mode: "rebuild", list: slotRange(ws).map(x => { const st = stOf(x), past = x.d === today() && nowHM() > MEAL_END[x.m], auto = past && st === "new"; return { ...x, st: auto ? "skip" : st, st0: st, auto, keep: past && (st === "lo" || st === "out") }; }) };   // 今日の時刻を過ぎた枠: 作る料理は最初「なし」に。作り置き・外食はそのまま残し、組み直しの対象にしない
  S.rbWish = "";
  // ① 作る日の状態を選ぶ
  const drawR = () => {
    openSheet(`<h2>🗓 作る日変更</h2><p class="note">① 今の献立の状態です。タップで レシピ → 簡単 → 作り置き → 外食 → なし と変えられます（変えていない枠は、なるべく今の料理のまま）。外食の枠は、標準的な1食分の栄養として計算します。</p>
      ${slotGridHtml(S.slotSel)}
      <label>希望（任意）<input id="rbWish" value="${esc(S.rbWish)}" placeholder="例: 木曜は簡単なものに"></label>
      <div class="grid2"><button class="btn" id="rbGo">次へ（在庫の確認）</button><button class="btn ghost" id="rbNo">やめる</button></div>`);
    const keep = () => { S.rbWish = $("rbWish").value.trim(); };
    $("sheetBody").querySelectorAll(".slot").forEach(b => b.onclick = () => { keep(); const x = S.slotSel.list.find(y => y.d + "|" + y.m === b.dataset.k); x.st = NEXT_ST[x.st]; drawR(); });
    $("rbNo").onclick = () => { S.slotSel = null; closeSheet(); };
    $("rbGo").onclick = () => { keep(); drawCheck(); };
  };
  // ② 今週使う予定だった在庫を確かめてから、組み直す
  const drawCheck = () => {
    const use = weekUse(planGroups().filter(x => x.date <= shiftDay(ws, 6))), items = S.stock.filter(s => use[s.id]).sort((a, b) => a.name.localeCompare(b.name, "ja"));
    openSheet(`<h2>🗓 作る日変更</h2><p class="note">② 在庫を確かめてください。今週の献立で使う予定だった食材です。量が違うものは直してください（空欄にすると「なくなった」）。</p>
      ${items.length ? `<ul class="list">${items.map((s, i) => `<li class="qrow"><span class="nm">${esc(s.name)}<small>使う予定: ${esc(use[s.id].map(x => fmtQ(x.amount)).join("＋"))}</small></span>${qtyBox(s.qty, "q", i, s.name)}</li>`).join("")}</ul>` : `<p class="note">使う予定の在庫はありません。</p>`}
      <div class="grid2"><button class="btn" id="rcGo">献立を見直す</button><button class="btn ghost" id="rcNo">やめる</button></div><button class="btn ghost wide" id="rcBack">← 作る日の選択に戻る</button>`);
    $("rcNo").onclick = () => { S.slotSel = null; closeSheet(); };
    $("rcBack").onclick = drawR;
    $("rcGo").onclick = async () => {
      const ups = [], rems = [];
      document.querySelectorAll("#sheetBody .q").forEach(inp => { const s = items[+inp.dataset.i], v = qtyVal(inp); if (!v) rems.push(s.id); else if (v !== s.qty) ups.push({ ...s, qty: v }); });
      if (ups.length || rems.length) { busy(true, "在庫を直しています…"); try { if (ups.length) await run("saveStock", ups); if (rems.length) await run("deleteStock", rems); await load(); } catch (e) { alert(e.message); busy(false); return; } busy(false); }
      const changed = S.slotSel.list.some(x => x.st !== x.st0 && !(x.auto && x.st === "skip")), lacks = planGroups().some(x => lacksOf(x, null, true).length);
      if (changed) { closeSheet(); startWeek(S.rbWish); return; }
      // 枠を変えていないとき: 足りない料理だけ、栄養を考えて作り直す（買い足しの提案あり）
      if (lacks) { closeSheet(); S.slotSel = null; startFix("", null, true); return; }
      alert("今の在庫で、予定の献立は全部作れます。枠も変えていないので、このままにします。"); S.slotSel = null; closeSheet(); draw();
    };
  };
  drawR();
}

// 在庫に合わせて見直す: 足りない料理（と、その作り置き）だけを作り直す
async function startFix(extra, picked, all, ngShop) {
  const gs = planGroups(), bad0 = gs.filter(x => lacksOf(x, null, true).length);
  if (!bad0.length) { alert("足りない材料はありません。今の在庫で、予定の献立は全部作れます。"); draw(); return; }
  if (all && !picked) picked = bad0.map(x => x.key);   // 在庫タブからは、足りない料理を全部見直す
  // まだ買っていないだけの物もあるので、作り直す料理を選んでもらう
  if (!picked) {
    openSheet(`<h2>作り直す料理を選ぶ</h2><p class="note">足りない材料がある料理です。これから買う予定の物なら、チェックを外してください。</p>
      <ul class="list">${bad0.map((x, i) => `<li><label class="row" style="font-weight:400;color:inherit"><input type="checkbox" data-i="${i}" checked style="width:auto"><span>${fmtDay(x.date)} ${MEAL_LABEL[x.meal]}: ${esc(x.title)}<br><small class="red">足りない: ${esc(lacksOf(x, null, true).map(o => normName(o.it.name)).join("、"))}</small></span></label></li>`).join("")}</ul>
      <div class="grid2"><button class="btn" id="fxGo">選んだ料理を作り直す</button><button class="btn ghost" id="fxNo">やめる</button></div>`);
    $("fxNo").onclick = closeSheet;
    $("fxGo").onclick = () => { const keys = [...document.querySelectorAll("#sheetBody input:checked")].map(c => bad0[+c.dataset.i].key); closeSheet(); if (keys.length) startFix(extra, keys); };
    return;
  }
  const bad = bad0.filter(x => picked.includes(x.key));
  if (!bad.length) return;
  // 作り直すのは、選んだ料理と、その作り置きの予定だけ（同じ枠のほかの料理はそのまま）
  const slots = new Set(), ids = new Set();
  bad.forEach(x => { slots.add(x.date + "|" + x.meal); x.ids.forEach(i => ids.add(i)); if (x.recipe) gs.filter(y => y.lo && y.recipe && y.recipe.id === x.recipe.id && y.date >= x.date).forEach(y => { slots.add(y.date + "|" + y.meal); y.ids.forEach(i => ids.add(i)); }); });
  const removeIds = [...ids];
  const keepPlans = S.plans.filter(p => !removeIds.includes(p.id)), res = reservations(planGroups(keepPlans));
  const ask = `${context("（下の「押さえている在庫」は使えない）")}
■ほかの予定で押さえている在庫（使えない）
${Object.entries(res).map(([id, l]) => `- ${(S.stock.find(s => s.id === id) || {}).name}: ${l.map(x => x.amount).join("＋")}`).join("\n") || "なし"}
${rules()}
【依頼】在庫が減って、次の枠の料理が作れなくなった。この枠の料理を、なるべく今の在庫だけで作れる料理に作り直す。
- 1日の栄養（カロリー・たんぱく質など）の目標を考える。在庫だけでは栄養が大きく足りないときだけ、買い足す食材を shopping に最小限入れてよい（その食材を meals で使う）。在庫で足りるなら shopping は空にする。
${[...slots].sort().map(k => { const [d, m] = k.split("|"), l = S.plans.filter(p => p.date === d && p.meal === m); return `- ${d} ${m}: 作り直す料理 ${l.filter(p => ids.has(p.id)).map(p => p.title + (isLo(p) ? "（作り置き）" : "")).join("・")}${l.some(p => !ids.has(p.id)) ? `（同じ枠でそのまま残る料理: ${l.filter(p => !ids.has(p.id)).map(p => p.title).join("・")}）` : ""}`; }).join("\n")}
- 作り直す料理1品につき、代わりの料理を1品ずつ入れる（主菜なら主菜、副菜なら副菜）。
- 足りない材料: ${[...new Set(bad.flatMap(x => lacksOf(x, null, true).map(o => normName(o.it.name))))].join("、")}
- これから買う予定の物（使ってよい）: ${[...new Set(gs.filter(x => !picked.includes(x.key)).flatMap(x => lacksOf(x, null, true).map(o => normName(o.it.name))))].join("、") || "なし"}
- 同じ食事の種類（朝・昼・夜・おやつ）のまま作り直す。作り置きの枠は、作る枠の料理の作り置きにする。
${S.rbWish ? `- 希望: ${S.rbWish}\n` : ""}${extra ? `- 前の案では、まだ足りない材料があった: ${extra}。この材料は使わない。\n` : ""}${ngShop && ngShop.length ? `- 次の物は買えない（使わない）: ${ngShop.join("、")}\n` : ""}
${FORMAT}
- shopping: [{"name":"食材名","amount":"買う量","reason":"なぜ必要か（栄養など）短く"}]（無ければ []）`;
  await askAi(ask, { mode: "fix", removeIds, slotKeys: [...slots], picked, ngShop: ngShop || [] });
}
async function askAi(prompt, meta) {

    <ul class="list" id="bcList">${B.items.map((it, i) => `<li class="qrow"><label class="bcck"><input type="checkbox" data-i="${i}" ${it.ck ? "checked" : ""}><span class="nmt">${esc(it.name)}<small>${it.before ? `元の在庫 ${esc(it.before)}・` : ""}${it.est ? `見積もり 約${yen(it.est)}円` : "見積もりなし"}</small></span></label>${qtyBox(it.qty, "q bq", i, it.name)}</li>`).join("")}</ul>

    <label>チェックした物の合計金額（円）<input id="bcTotal" inputmode="numeric" placeholder="例: 2480"></label>
    <p class="note" id="bcEst"></p>
    <div class="grid2"><button class="btn" id="bcSave">保存する</button><button class="btn ghost" id="bcLater">あとで</button></div>
    <button class="btn ghost wide" id="bcSkip">確認しない（この画面を消す）</button>`);
  const cks = () => [...document.querySelectorAll("#bcList input[type=checkbox]")].filter(c => c.checked).map(c => B.items[+c.dataset.i]);
  const est = () => { const l = cks(); $("bcEst").textContent = l.length ? `チェックした${l.length}品の見積もり 約${yen(l.reduce((s, x) => s + (x.est || 0), 0))}円${l.some(x => !x.est) ? "（見積もりの無い物を含む）" : ""}` : "合計金額を入れるときは、その金額に含まれる物にチェックしてください。"; };
  $("bcList").addEventListener("change", e => { if (e.target.type === "checkbox") { B.items[+e.target.dataset.i].ck = e.target.checked; lsSet("buyChk", B); est(); } });
  est();
  $("bcLater").onclick = () => { closeSheet(); draw(); };
  $("bcSkip").onclick = () => { if (!confirm("買った物の確認を消しますか？（在庫はそのままです）")) return; lsDel("buyChk"); closeSheet(); draw(); };
  $("bcSave").onclick = async () => {
    const ups = [], rems = [], more = [];
    document.querySelectorAll("#bcList .bq").forEach(box => {
      const it = B.items[+box.dataset.i], v = qtyVal(box); if (v === it.qty) return;
      const s = S.stock.find(x => normName(x.name) === normName(it.sname)) || matchStock(it.sname); if (!s) return;
      const q = it.before ? (v ? addQty(it.before, v) : it.before) : v;
      if (q) ups.push({ ...s, qty: q }); else rems.push(s.id);
      const a = pq(v), b = pq(it.plan); if (a && b && a.u === b.u && a.n > b.n) more.push(it.name);
    });
    const total = +String($("bcTotal").value).normalize("NFKC").replace(/[^\d]/g, "") || 0, l = cks(), estC = l.reduce((s, x) => s + (x.est || 0), 0);
    if (total && !l.length) { alert("合計金額に含まれる物にチェックしてください"); return; }
    if (rems.length && !confirm(`${rems.map(id => S.stock.find(s => s.id === id).name).join("、")} は、在庫から消します（今回買った分が0のため）。よいですか？`)) return;
    busy(true, "保存しています…");
    try {
      if (ups.length) await run("saveStock", ups); if (rems.length) await run("deleteStock", rems);
      if (total && estC) {
        const line = `${+B.at.slice(5, 7)}/${+B.at.slice(8)}: 見積もり 約${yen(estC)}円 → 実際 ${yen(total)}円（${(total / estC).toFixed(2)}倍）: ${l.map(x => x.name).join("、").slice(0, 100)}`;
        const v = [line, ...String(SET("相場記録") || "").split("\n").filter(Boolean)].slice(0, 8).join("\n");
        S.settings["相場記録"] = v; await run("saveSetting", "相場記録", v);
      }
      await load(); if (more.length) await spreadExtra(more);
    } catch (e) { busy(false); alert(e.message); return; }
    busy(false); lsDel("buyChk");
    // 実際の金額で予算に余裕があり、カロリーが目標に届かない日があれば、追加の買い物を提案する
    const actual = total && estC && B.cost ? B.cost - estC + total : null, rest = actual != null ? Math.round(B.lim - actual) : null;
    const tg = (target(1).kcal + target(2).kcal) / 2;
    const short = (B.days || []).filter(d => d >= today()).map(d => ({ d, n: dayNut(d) })).filter(x => tg && x.n.kcal < tg * .9);
    if (rest != null && rest >= 300 && short.length) {
      openSheet(`<h2>💰 まだ予算に余裕があります</h2><p>実際の金額で計算すると、この期間の予算に<b>約${yen(rest)}円</b>の余裕があります。</p><p class="note">カロリーが目標（1人 約${yen(tg)}kcal）に届かない日: ${short.map(x => `${fmtDay(x.d)} 約${yen(x.n.kcal)}kcal`).join("、")}</p><p><b>材料を追加購入・献立再構成しますか？</b></p><p class="note">買った在庫と組み合わせて、追加で買ってよい材料と、それを使う献立をAIが提案します。買う前に、買える／買えないを選べます。</p><div class="grid2"><button class="btn" id="bsGo">提案してもらう</button><button class="btn ghost" id="bsNo">しない</button></div>`);
      $("bsNo").onclick = () => { closeSheet(); draw(); };
      $("bsGo").onclick = () => { closeSheet(); boostPlan(rest, short.map(x => x.d)); };
      return;
    }
    closeSheet(); draw();
    alert(`保存しました。${rest != null ? `\n実際の金額で計算した、この期間の予算の${rest >= 0 ? `残り: 約${yen(rest)}円` : `こえた分: 約${yen(-rest)}円`}` : ""}`);
  };
}
// 予算の余りで買い足して、栄養が足りない日の献立を足す・作り直す（変える枠はAIが選ぶ）
async function boostPlan(yen, days, ngShop, wish) {
  const fut = S.plans.filter(p => notYet(p)), keys = [...new Set(fut.map(p => p.date + "|" + p.meal))].sort();
  if (!keys.length) { alert("これからの献立がありません"); return; }
  const tg = { kcal: Math.round((target(1).kcal + target(2).kcal) / 2), p: Math.round((target(1).p + target(2).p) / 2) };
  const ask = `${context()}
${rules()}
【依頼】買い物のあと、この期間の予算にまだ約${yen}円の余裕がある。一方で、次の日の栄養が目標（1人 約${tg.kcal}kcal・P${tg.p}）より少ない: ${(days || []).map(d => { const n = dayNut(d); return `${d}（1人 約${Math.round(n.kcal)}kcal・P${Math.round(n.p)}）`; }).join("、")}。
- 予算の余り（合計約${yen}円まで）で買い足す食材を shopping に入れ、今ある在庫（さっき買った物も含む）と組み合わせて、栄養が足りない日の料理を足すか作り直し、目標に近づける。
- 今の献立（変えない枠は書かない。変える枠だけ meals に書く。変える枠は、その枠で食べる料理を全部書く（そのまま残す料理や白ごはんも recipe_id で書く）。作る枠を変えたら、その作り置きの枠も一緒に書く）:
${keys.map(k => { const [d, m] = k.split("|"); return `- ${d} ${m}: ${uniqPlans(fut.filter(p => p.date === d && p.meal === m)).map(p => `${p.title}${p.recipeId && !isOut(p) ? `（recipe_id=${p.recipeId}）` : ""}${isLo(p) ? "［作り置き］" : ""}${isOut(p) ? "［外食］" : ""}`).join("・")}`; }).join("\n")}
- 変える枠はなるべく少なくする。外食の枠は変えない。
${(ngShop || []).length ? `- 次の物は買えない（使わない）: ${ngShop.join("、")}\n` : ""}${wish ? `- 希望: ${wish}\n` : ""}
${FORMAT}
- shopping: [{"name":"食材名","amount":"買う量","reason":"なぜ必要か（栄養など）短く"}]`;
  await askAi(ask, { mode: "fix", kind: "boost", yen, short: days || [], removeIds: fut.map(p => p.id), slotKeys: keys, picked: [], ngShop: ngShop || [] });
}

// 使い切りたい食材: 野菜室の物と、期限が近い冷蔵・冷凍の物で、予定の料理で使ったあとにまだ残る量
const PERISH_CAT = /野菜室|冷蔵|瞬冷凍/;
function leftovers(plans, end) {
  const gs = planGroups(plans), res = reservations(gs), last = end || gs.reduce((m, x) => x.date > m ? x.date : m, today());
  return S.stock.filter(s => PERISH_CAT.test(s.cat || "") && !/^(あり|わずか)$/.test(s.qty) && s.qty !== OUT).map(s => {
    const left = res[s.id] ? availableQty(s, res) : s.qty, p = pqAll(left)[0];
    if (!p || p.n <= 1e-6 || /^(ml|mL|L|cc)$/.test(p.u) || (s.exp && s.exp < today())) return null;   // 期限が過ぎた物は数えない
    if (s.cat === "瞬冷凍") { if (!s.exp || s.exp > shiftDay(today(), 7)) return null; }   // 瞬冷凍は、期限が7日以内になった物だけ
    else if (s.cat !== "野菜室" && s.exp && s.exp > shiftDay(last, 3)) return null;   // 冷蔵・冷凍で期限に余裕がある物（卵・納豆など）は除く
    if (s.cat !== "野菜室" && !s.exp && !RAW_RE.test(normName(s.name))) return null;
    return { s, left: fmtQ(left), used: !!res[s.id] };
  }).filter(Boolean).sort((a, b) => (a.s.exp || "9").localeCompare(b.s.exp || "9"));
}
// しばらく献立に出ていない調味料（読み込んでいる過去2週間とこれからの予定で判定。古い順・期限の近い順に数品）
function staleSeasonings(plans, lim) {
  const last = {};
  plans.forEach(p => { const r = recipeOf(p.recipeId); if (r) ingsOf(r).forEach(i => { const st = matchStock(i.name); if (st && (!last[st.id] || last[st.id] < p.date)) last[st.id] = p.date; }); });
  return S.stock.filter(s => isSeas(s) && hasQty(s) && !(last[s.id] > shiftDay(today(), -7)))
    .sort((a, b) => (last[a.id] || "").localeCompare(last[b.id] || "") || (a.exp || "9").localeCompare(b.exp || "9")).slice(0, lim || 5);
}
const leftoverText = l => l.map(x => `${x.s.name} ${x.left}${x.s.exp ? `（期限 ${x.s.exp}）` : ""}`).join("、");
// 浮いた・残る食材を使い切るように、これからの献立の一部を作り直す（変える枠はAIが選ぶ）
async function useLeftovers(items, wish, opts) {
  opts = opts || {};
  const fut = S.plans.filter(p => notYet(p)), keys = [...new Set(fut.map(p => p.date + "|" + p.meal))].sort();
  if (!keys.length) { alert("これからの献立がありません"); return; }
  const ask = `${context()}
${rules()}
【依頼】次の食材が、今の献立では使われずに残る見込み。これからの献立のうち、いくつかの枠の料理を作り直して、残さず使い切る。
- 使い切りたい食材: ${leftoverText(items)}
- 今の献立（変えない枠はそのまま。変える枠だけ meals に書く。作る枠を変えたら、その作り置きの枠も一緒に書く）:
${keys.map(k => { const [d, m] = k.split("|"); return `- ${d} ${m}: ${uniqPlans(fut.filter(p => p.date === d && p.meal === m)).map(p => `${p.title}${p.recipeId && !isOut(p) ? `（recipe_id=${p.recipeId}）` : ""}${isLo(p) ? "［作り置き］" : ""}${isOut(p) ? "［外食］" : ""}`).join("・")}`; }).join("\n")}
- 外食の枠と、作り置きを食べる枠だけの日は、なるべく変えない。変える枠はなるべく少なくする。買い足しはしない（shopping は []）。
${wish ? `- 希望: ${wish}
` : ""}
${FORMAT}
- shopping: []`;
  await askAi(ask, { mode: "fix", kind: "lo", auto: !!opts.auto, loItems: items.map(x => ({ id: x.s.id })), removeIds: fut.map(p => p.id), slotKeys: keys, picked: [], ngShop: [], stockOnly: !!opts.stockOnly, mustUse: opts.mustUse || items.map(x => x.s.id) });
}
// 買った量が多かった食材: これからの料理の分量を同じ割合で増やし、在庫の量をちょうど使い切る（その週の料理だけ、レシピの写しを作って直す）
async function spreadExtra(names) {
  const gs = planGroups(), ups = [], moves = [];
  for (const name of names) {
    const s = matchStock(name); if (!s) continue;
    const res = reservations(gs), list = res[s.id]; if (!list) continue;
    const have = pqAll(s.qty)[0]; if (!have) continue;
    let need = 0; for (const x of list) { const a = convIn(pqAll(x.amount), have.u); if (a == null) { need = 0; break; } need += a; }
    if (!(need > 0) || have.n <= need * 1.03) continue;
    const f = have.n / need;
    gs.filter(x => x.recipe && !x.lo && ingsOf(x.recipe).some(i => (matchStock(i.name) || {}).id === s.id)).forEach(x => {
      const r = ups.find(u => u.from === x.recipe.id) || (ups.push({ from: x.recipe.id, r: { ...x.recipe, id: "", ingredients: x.recipe.ingredients, memo: `${x.recipe.memo || ""}（買った量に合わせて増量）` } }), ups[ups.length - 1]);
      r.r.ingredients = ingsOf(r.r).map(i => (matchStock(i.name) || {}).id === s.id ? `${i.name}：${scaleAmount(i.amount, f)}` : `${i.name}：${i.amount}`).join("\n");
    });
  }
  if (!ups.length) return;
  busy(true, "買った量に合わせて、分量を配分しています…", "数秒で終わります");
  try {
    const ids = await run("saveRecipes", ups.map(u => u.r));
    ups.forEach((u, i) => S.plans.filter(p => p.recipeId === u.from && notYet(p)).forEach(p => { const { _row, ...o } = p; moves.push({ ...o, recipeId: ids[i] }); }));
    if (moves.length) await run("savePlans", moves);
  } catch (e) { alert(e.message); }
  busy(false);
}
// 案の在庫を直す → 足りなくなった材料があれば、考え直す
async function checkDraftStock(D, used) {
  const ups = [], rems = [];
  document.querySelectorAll("#app .dq").forEach(inp => { const s = used[+inp.dataset.i], v = qtyVal(inp); if (!v) rems.push(s.id); else if (v !== s.qty) ups.push({ ...s, qty: v }); });
  const before = new Set(shopItems(draftState(D).plans).map(i => i.name));
  if (ups.length || rems.length) { busy(true, "在庫を直しています…"); try { if (ups.length) await run("saveStock", ups); if (rems.length) await run("deleteStock", rems); await load(); } catch (e) { alert(e.message); busy(false); return; } busy(false); }
  const st = draftState(D), newShort = shopItems(st.plans).map(i => i.name).filter(n => !before.has(n)), lacks = D.mode === "fix" ? draftLacks(D) : [];
  const bad = [...new Set([...newShort, ...lacks])];
  if (!bad.length) { D.checked = true; draw(); window.scrollTo(0, document.body.scrollHeight); return; }
  if (!confirm(`在庫を直したら、足りない材料が出ました: ${bad.join("、")}。\n献立を考え直します。`)) { D.checked = false; draw(); return; }
  const why = `在庫を確かめたら、次の材料が足りなかった: ${bad.join("、")}。この材料を使う料理は、今の在庫で作れる料理に作り直す（栄養も考える）`;
  D.mode === "week" ? startWeek(S.rbWish || "", why) : startFix(bad.join("、"), D.picked, false, D.ngShop);
}
try { const c = JSON.parse(localStorage.getItem(DATA_KEY) || "null"); if (c) { WQ.forEach(op => wqApply(c, op.fn, op.a)); Object.assign(S, c); S.stale = true; draw(); showStale(true); } } catch (e) { S.stale = false; }
{ const k = lsGet("draftKeep"); if (k && k.draft && !S.draft) { S.draft = k.draft; S.applied = k.draft.jobId; const c = k.ctx || {}; S.slotSel = S.slotSel || c.slotSel; S.rbWish = S.rbWish || c.rbWish || ""; S.dealText = S.dealText || c.dealText || ""; S.tab = "menu"; } }
{ const f = lsGet("jobFail"); if (f) S.jobFail = f; }
load().catch(e => { if (S.stale) { const b = $("staleBn"); b.textContent = "最新の内容を読み込めませんでした（前回の内容を表示中）: " + String(e && e.message || e).slice(0, 120); return; } $("app").innerHTML = `<div class="msg">読み込めませんでした: ${esc(e.message)}<br>スプレッドシートで setup() を実行したか確かめてください。</div>`; });
</script>
